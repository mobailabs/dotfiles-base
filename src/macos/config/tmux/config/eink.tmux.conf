##### E-ink 主题覆盖 #####

# 状态栏
set-option -g status-style none,fg=#000000,bg=#ffffff

# 降低刷新频率（墨水屏 15s 刷新会闪烁）
set-option -g status-interval 300

# 左侧：会话名（黑底白字反色块）+ 窗口数 + PFX
set -g status-left '#[fg=#ffffff,bg=#000000,bold] #S #[fg=#aaaaaa,bg=#ffffff]| #[fg=#666666]#{session_windows}w#{?client_prefix, #[fg=#aaaaaa]| #[fg=#000000,bold,reverse]PFX,} '

# 右侧：项目 | 分支 | 主机名（去掉时间和 sysinfo，减少墨水屏闪烁）
set -g status-right '#[fg=#000000,bg=#ffffff]#(basename "#{pane_current_path}")#[fg=#aaaaaa]| #{?#{==:#{pane_current_path},},,#[fg=#333333,bold]#(~/.config/tmux/bin/git-branch "#{pane_current_path}")}#[fg=#aaaaaa]| #[fg=#666666]@#h'

# 窗口标签
set -g window-status-style "fg=#555555,bg=#e0e0e0"
set -g window-status-format '#[fg=#555555,bg=#e0e0e0] #I:#W#{?window_zoomed_flag, Z,}#{?window_activity_flag, .,} '

# 当前窗口（反色）
set -g window-status-current-style "fg=#ffffff,bg=#000000"
set -g window-status-current-format '#[fg=#ffffff,bg=#000000,bold] #I:#W#{?window_zoomed_flag, Z,} '

# 活动高亮（粗体代替颜色）
set -g window-status-activity-style "fg=#000000,bg=#cccccc,bold"

# 面板边框
set-option -g pane-active-border-style fg=#000000
set-option -g pane-border-style fg=#999999

# 消息框（反色）
set-option -g message-style none,fg=#ffffff,bg=#000000
set-option -g message-command-style none,fg=#ffffff,bg=#000000
