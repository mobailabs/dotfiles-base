##### Prefix 使用默认 C-b #####
set-option -g prefix C-b
unbind-key C-a
bind-key C-b send-prefix
set -g extended-keys on
set -g extended-keys-format csi-u

##### 插件（会话持久化）#####
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-sensible'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @plugin 'tmux-plugins/tmux-yank'

# continuum: 自动保存 + tmux 启动后自动恢复
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '15'

# resurrect: 保存 pane 内容，nvim 使用会话策略
set-option -g @resurrect-capture-pane-contents 'on'
set-option -g @resurrect-strategy-nvim 'session'

# TPM 存在时才加载，避免首次安装前报错
if-shell 'test -d ~/.tmux/plugins/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'

##### 行为与通用设置 #####
set-option -g repeat-time 0
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename on
set-window-option -g monitor-activity off
set-option -g visual-activity off
set-option -g history-limit 50000
set-option -g mouse on
set-option -sg escape-time 0
set-option -g focus-events on
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -ga terminal-overrides ",ghostty:Tc"
set-option -g set-clipboard on
set-option -g allow-passthrough on

##### 标题 #####
set-option -g set-titles on

##### 复制模式 #####
set-window-option -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# 优化鼠标体验：拖拽结束自动复制到系统剪贴板 (OSC 52)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel


##### Pane 导航（Vim hjkl）#####
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# 快速切换到最后一个面板
bind-key Tab last-pane

##### Pane 调整大小 #####
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# 快速交换面板位置
bind-key -r "}" swap-pane -D
bind-key -r "{" swap-pane -U

##### 关闭确认去除 #####
bind-key x kill-pane
bind-key & kill-window

##### 窗口导航 #####
# 回到上一个窗口
bind-key ^ last-window

# 上一个/下一个窗口（对应 Ghostty ⌘[/⌘]）
bind-key p previous-window
bind-key n next-window

# 窗口重新排序
bind-key -r < swap-window -t -1 -d
bind-key -r > swap-window -t +1 -d

##### 新窗口/分割（保持当前路径）#####
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

##### Pane 移动到指定窗口 #####
bind-key M-1 join-pane -t :1
bind-key M-2 join-pane -t :2
bind-key M-3 join-pane -t :3
bind-key M-4 join-pane -t :4
bind-key M-5 join-pane -t :5
bind-key M-6 join-pane -t :6
bind-key M-7 join-pane -t :7
bind-key M-8 join-pane -t :8
bind-key M-9 join-pane -t :9

##### 快捷弹窗 #####
# 命令选择器（添加窗口大小确保 fzf 显示完整）
bind-key R display-popup -E -w 90% -h 80% "~/.config/tmux/bin/tmux-commands | xargs -I{} tmux send-keys '{}' enter"
bind-key C display-popup -E -w 90% -h 80% "~/.config/tmux/bin/tmux-commands | xargs tmux new-window -c '#{pane_current_path}'"
bind-key | display-popup -E -w 90% -h 80% "~/.config/tmux/bin/tmux-commands | xargs tmux split-window -v -c '#{pane_current_path}'"
bind-key - display-popup -E -w 90% -h 80% "~/.config/tmux/bin/tmux-commands | xargs tmux split-window -h -c '#{pane_current_path}'"

# 快速临时终端（scratch pad）
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}"

# 快速 man 手册
bind-key M command-prompt -p "man:" "display-popup -E -w 80% -h 90% 'man %%'"

# 快速 git 状态
bind-key G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "git status && echo && echo 'Press ENTER to close' && read"

##### 会话管理 #####
bind-key N new-session -A -c "#{pane_current_path}" -s "#(basename #{pane_current_path})"
bind-key X kill-session
bind-key S display-popup -E -w 80% -h 60% "~/.config/tmux/bin/tmux-sessions | xargs tmux switch-client -t"

bind-key P if-shell -F '#{==:#{session_name},popup}' {
  detach-client
} {
  if-shell -F '#{e|==:#{N/s:popup},0}' {
    new-session -d -s 'popup' 'tmux source-file ~/.config/tmux/sessions/popup.tmux.conf'
  }
  display-popup -w 80% -h 80% -E "tmux attach-session -t popup"
}

bind-key I set-window-option synchronize-panes

##### 默认 shell（按常见安装路径探测，**第一个存在的胜出**）#####
# ⚠️ 不能写成 5 条独立的 if-shell：tmux 会把它们**全部依次执行**，
# 每条匹配的都 set 一次，于是最后一条（/bin/zsh，macOS 上永远存在）
# 总是胜出 —— 想要的是「优先 homebrew zsh」。
# 这里在一条 shell 命令里按优先级找到第一个存在的路径，直接 set。
run-shell 'for c in /opt/homebrew/bin/zsh /usr/local/bin/zsh /usr/bin/zsh /opt/local/bin/zsh /bin/zsh; do [ -x "$c" ] && { tmux set-option -g default-shell "$c"; break; }; done'

# 强制使用 default-shell 启动新 pane，避免插件把 default-command 绑定到旧的 bash
set-option -g default-command ""

##### 状态栏（Monokai Pro Ristretto warm dark）#####
set-option -g status on
set-option -g status-interval 15
set-option -g status-position top
set-option -g status-justify left
set-option -g status-style none,fg=#FCFCFA,bg=#2D2A2E

###### 左侧：会话名 | 窗口数 | (前缀指示) ######
set -g status-left-length 80
set -g status-left-style none
set -g status-left '#[fg=#2D2A2E,bg=#FC9867,bold] #S #[fg=#5B595C,bg=#2D2A2E]| #[fg=#939293]#{session_windows}w#{?client_prefix, #[fg=#5B595C]| #[fg=#FFD866]PFX,} '

###### 右侧 ######
set -g status-right-length 120
set -g status-right-style none
set -g status-right '#[fg=#939293,bg=#2D2A2E] %H:%M #[fg=#5B595C]| #[fg=#FCFCFA]#(basename "#{pane_current_path}")#[fg=#5B595C]| #{?#{==:#{pane_current_path},},,#[fg=#FC9867]#(~/.config/tmux/bin/git-branch "#{pane_current_path}")}#[fg=#5B595C]| #[fg=#FCFCFA]#(~/.config/tmux/bin/sysinfo) #[fg=#5B595C]| #[fg=#939293]@#h'

###### 窗口标签 ######
set -g window-status-separator ' '
set -g window-status-style "fg=#939293,bg=#403E41"
set -g window-status-format '#[fg=#939293,bg=#403E41] #I:#W#{?window_zoomed_flag, Z,} '

set -g window-status-current-style "fg=#2D2A2E,bg=#FC9867"
set -g window-status-current-format '#[fg=#2D2A2E,bg=#FC9867,bold] #I:#W#{?window_zoomed_flag, Z,} '

set -g window-status-activity-style "fg=#FFD866,bg=#403E41"

###### Pane 边框与消息框 ######
set-option -g pane-active-border-style fg='#FC9867'
set-option -g pane-border-style fg='#5B595C'

set-option -g message-style none,fg='#FCFCFA',bg='#403E41'
set-option -g message-command-style none,fg='#FCFCFA',bg='#403E41'
