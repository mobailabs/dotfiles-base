##### 兼容层：老 tmux 的入口 #####
#
# ⚠️ 这不是真配置，是个**转发 shim**。真配置在
#    src/macos/config/tmux/config/tmux.conf（链接到 ~/.config/tmux/tmux.conf）。
#
# ## 为什么需要它
#
# tmux 的配置查找顺序（3.1 起支持 XDG）：
#
#     ~/.config/tmux/tmux.conf     ← 优先
#     ~/.tmux.conf                 ← 其次
#
# 所以在 **tmux 3.1+** 上，tmux 直接读 XDG 那份，**根本不会读本文件**——
# 本文件是给 **tmux < 3.1**（不认 XDG）准备的：那些版本只读 ~/.tmux.conf，
# 于是读到这里、再 source 真配置。
#
# ## 还有第二个理由（这个才是删不掉的）
#
# scripts/common/tmux-plugins-install.zsh 拿 `~/.tmux.conf 存不存在`
# 当「该不该装 TPM 插件」的开关。删掉本文件（和它对应的落点）会让
# 那个判断失败 → 插件静默不装。要删就得先改那个 gate。
#
# ## 不要在这里写配置
#
# 改 tmux 配置去 config/tmux.conf。往这里加东西只会在 3.1+ 上**永远不生效**。

source-file ~/.config/tmux/tmux.conf
